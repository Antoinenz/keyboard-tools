name: Feeder
options:
  bundleIdPrefix: com.antoinenz
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V5944XY7RG
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Feeder:
    type: application
    platform: macOS
    sources: [Feeder]
    info:
      path: Feeder/Info.plist
      properties:
        CFBundleName: Feeder
        CFBundleDisplayName: Feeder
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinenz.feeder
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  FeederTests:
    type: bundle.unit-test
    platform: macOS
    # Pure-logic files are compiled straight into the tests (no app host needed).
    sources:
      - FeederTests
      - Feeder/TextFeeder.swift
      - Feeder/ArmKey.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinenz.feeder.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Feeder:
    build:
      targets:
        Feeder: all
        FeederTests: [test]
    test:
      targets: [FeederTests]
